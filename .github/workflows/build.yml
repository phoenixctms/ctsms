name: Build and Analyze
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    branches-ignore:
      - 'l10n_master'
permissions:
  contents: read
jobs:
  build:
    name: Build and Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false
      - name: Set up JDK 11
        run: |
          sudo apt-get update
          sudo apt-get -q -y install default-jdk
#         apt-get -q -y install libservlet3.1-java tomcat9
#        uses: actions/setup-java@v1
#        with:
#          java-version: 11
      # repo.maven.apache.org returns 403 to GitHub-hosted runners for this tarball.
      - name: Set up Maven
        run: |
          MAVEN_VERSION=3.8.7
          curl -fsSL -o "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          tar -xzf "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}-bin.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build
        # sonar-maven-plugin is bound to verify in pom.xml; skip analysis in CI (no SONAR_TOKEN).
        run: mvn verify -DskipTests -Dsonar.skip=true --no-transfer-progress -c
