name: Build and Test
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    branches-ignore:
      - 'l10n_master'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false
      # Temurin from the runner's tool cache or GitHub's CDN instead of apt's default-jdk: the
      # Ubuntu mirror sometimes serves the 154 MB of default-jdk at ~60 kB/s (40+ minutes).
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      # repo.maven.apache.org returns 403 to GitHub-hosted runners for this tarball.
      - name: Set up Maven
        run: |
          MAVEN_VERSION=3.8.7
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          tar -xzf "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}-bin.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -v
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build
        run: |
          VERSION=$(grep -oP '<application.version>\K[^<]+' /home/runner/work/ctsms/ctsms/pom.xml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          COMMIT=$(git log --format=%B -n 1 "$GITHUB_SHA")
          COMMIT_MESSAGE_REGEX="[Mm]erge [a-zA-Z0-9]+ into [a-zA-Z0-9]+"
          if [[ $COMMIT =~ $COMMIT_MESSAGE_REGEX ]];
          then
              COMMIT=$(echo "$COMMIT" | sed -e 's/[Mm]erge \([a-zA-Z0-9]\+\) into [a-zA-Z0-9]\+/\1/' | cut -c 1-7)
          else
              COMMIT=$(git rev-parse --short HEAD)
          fi
          echo "COMMIT=$COMMIT" >> $GITHUB_ENV
          sed -r -i "s/<application.version>([^<]+)<\/application.version>/<application.version>\1 [$COMMIT]<\/application.version>/" /home/runner/work/ctsms/ctsms/pom.xml
          UUID="test-"
          UUID+=$(cat /proc/sys/kernel/random/uuid)
          sed -r -i "s/<application.uuid><\/application.uuid>/<application.uuid>$UUID<\/application.uuid>/" /home/runner/work/ctsms/ctsms/pom.xml
          mvn install -DskipTests --no-transfer-progress -c
      # The Ubuntu mirror sometimes serves packages very slowly. Keep the downloaded .debs between runs
      # (restored below, saved after the last apt install), so most runs only fetch the package index.
      # apt's own retries plus apt_install.sh (retries the whole install after a minute) ride out mirror
      # dropouts; timeout-minutes on the apt steps end a stuck download instead of 40+ minutes of waiting.
      - name: Configure apt
        id: apt-config
        run: |
          # runner image variables are not in the env context; new image = new package versions
          echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
          sudo install -d -o "$USER" /var/cache/apt-ci /var/cache/apt-ci/partial
          sudo tee /etc/apt/apt.conf.d/90ci >/dev/null <<'EOF'
          Dir::Cache::Archives "/var/cache/apt-ci/";
          APT::Keep-Downloaded-Packages "true";
          Binary::apt::APT::Keep-Downloaded-Packages "true";
          Acquire::Retries "3";
          Acquire::http::Timeout "60";
          Acquire::https::Timeout "60";
          EOF
      - name: Restore apt packages
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: /var/cache/apt-ci/*.deb
          key: apt-test-${{ steps.apt-config.outputs.image }}-${{ hashFiles('.github/workflows/test.yml', '.github/workflows/setup_*.sh') }}
          restore-keys: apt-test-
      # package index for the apt installs below (database, BulkProcessor, Tomcat, wkhtmltopdf)
      - name: Update apt package index
        timeout-minutes: 5
        run: sudo apt-get update
      - name: Setup database
        timeout-minutes: 20
        run: |
          sudo chmod 755 /home/runner/work/ctsms/ctsms/.github/workflows/setup_database.sh
          /home/runner/work/ctsms/ctsms/.github/workflows/setup_database.sh
      - name: Download master data
        run: |
          sudo chmod 755 /home/runner/work/ctsms/ctsms/.github/workflows/download_masterdata.sh
          sudo /home/runner/work/ctsms/ctsms/.github/workflows/download_masterdata.sh
      - name: Setup BulkProcessor
        timeout-minutes: 20
        run: |
          sudo chmod 755 /home/runner/work/ctsms/ctsms/.github/workflows/setup_bulkprocessor.sh
          # sudo-rs on Ubuntu 26.04 ignores -E/--preserve-env; this script needs no caller env
          sudo /home/runner/work/ctsms/ctsms/.github/workflows/setup_bulkprocessor.sh
      - name: Setup dbtool.sh
        env:
          MAIL_SENDER_HOST: ${{ secrets.MAIL_SENDER_HOST }}
          MAIL_SENDER_PORT: ${{ secrets.MAIL_SENDER_PORT }}
          MAIL_SENDER_PROTOCOL: ${{ secrets.MAIL_SENDER_PROTOCOL }}
          MAIL_SENDER_USERNAME: ${{ secrets.MAIL_SENDER_USERNAME }}
          MAIL_SENDER_PASSWORD: ${{ secrets.MAIL_SENDER_PASSWORD }}
          MAIL_SENDER_AUTH: ${{ secrets.MAIL_SENDER_AUTH }}
          MAIL_SENDER_STARTTLS: ${{ secrets.MAIL_SENDER_STARTTLS }}
          MAIL_SENDER_ADDRESS: ${{ secrets.MAIL_SENDER_ADDRESS }}
        run: |
          sudo echo "email_exec_from_address=$MAIL_SENDER_ADDRESS" >> /ctsms/properties/ctsms-settings.properties
          sudo echo "email_exec_from_name=Phoenix CTMS Automated Tests" >> /ctsms/properties/ctsms-settings.properties
          sudo echo "job_mail_sender_host=$MAIL_SENDER_HOST" >> /ctsms/properties/ctsms-applicationcontext.properties
          sudo echo "job_mail_sender_port=$MAIL_SENDER_PORT" >> /ctsms/properties/ctsms-applicationcontext.properties
          sudo echo "job_mail_sender_protocol=$MAIL_SENDER_PROTOCOL" >> /ctsms/properties/ctsms-applicationcontext.properties
          sudo echo "job_mail_sender_username=$MAIL_SENDER_USERNAME" >> /ctsms/properties/ctsms-applicationcontext.properties
          sudo echo "job_mail_sender_password=$MAIL_SENDER_PASSWORD" >> /ctsms/properties/ctsms-applicationcontext.properties
          sudo touch /ctsms/properties/ctsms-job-mail-sender.properties
          sudo chown ctsms:ctsms /ctsms/properties/ctsms-job-mail-sender.properties
          sudo chmod 777 /ctsms/properties/ctsms-job-mail-sender.properties
          sudo echo "mail.smtp.auth=$MAIL_SENDER_AUTH" >> /ctsms/properties/ctsms-job-mail-sender.properties
          sudo echo "mail.smtp.starttls.enable=$MAIL_SENDER_STARTTLS" >> /ctsms/properties/ctsms-job-mail-sender.properties
          sudo chown ctsms:ctsms /home/runner/work/ctsms/ctsms/.github/workflows/dbtool.sh
          sudo chmod 755 /home/runner/work/ctsms/ctsms/.github/workflows/dbtool.sh
          sudo mv /home/runner/work/ctsms/ctsms/.github/workflows/dbtool.sh /ctsms/dbtool.sh
          sudo chmod 777 /home
          sudo chmod 777 /home/runner
          sudo chmod 777 /home/runner/work
          sudo chmod 777 /home/runner/work/ctsms
          sudo chmod 777 /home/runner/work/ctsms/ctsms/web -R
      - name: Initialize database
        run: |
          sudo chmod 755 /home/runner/work/ctsms/ctsms/.github/workflows/init_database.sh
          /home/runner/work/ctsms/ctsms/.github/workflows/init_database.sh
      - name: Setup Tomcat
        timeout-minutes: 20
        run: |
          sudo chmod 755 /home/runner/work/ctsms/ctsms/.github/workflows/setup_tomcat10.sh
          # sudo-rs on Ubuntu 26.04 ignores -E/--preserve-env; pass VERSION and JAVA_HOME explicitly
          sudo VERSION="$VERSION" JAVA_HOME="$JAVA_HOME" /home/runner/work/ctsms/ctsms/.github/workflows/setup_tomcat10.sh
      - name: Snapshot REST API swagger.json and index
        # Fetched on every run, so a broken spec shows up in PRs too; published only from master.
        # Both describe the CI Tomcat, so drop its host/schemes and instance details, and make the index URLs relative.
        run: |
          for i in $(seq 1 36); do
            if curl -fsS --max-time 60 -o "$RUNNER_TEMP/swagger-raw.json" http://localhost:8080/rest/swagger.json; then
              break
            fi
            sleep 5
          done
          jq -e 'del(.host, .schemes) | select(.swagger and (.paths | length > 0) and .securityDefinitions.basicAuth and (.security | length > 0))' "$RUNNER_TEMP/swagger-raw.json" > "$RUNNER_TEMP/swagger.json"
          echo "swagger.json: $(jq '.paths | length' "$RUNNER_TEMP/swagger.json") paths, version $(jq -r '.info.version' "$RUNNER_TEMP/swagger.json"), security $(jq -c '.securityDefinitions | keys' "$RUNNER_TEMP/swagger.json")"
          curl -fsS --max-time 120 -o "$RUNNER_TEMP/index-raw.json" http://localhost:8080/rest/
          # the response wraps the index in {"index": ...} (IndexBase field), kept as the API returns it
          jq -e 'del(.index.instance, .index.jvm, .index.announcement)
            | walk(if type == "string" then sub("^https?://[^/]+/rest"; "/rest") else . end)
            | select(.index.services | length > 0)' "$RUNNER_TEMP/index-raw.json" > "$RUNNER_TEMP/restapi-index.json"
          echo "restapi-index.json: $(jq '.index.services | length' "$RUNNER_TEMP/restapi-index.json") services, version $(jq -r '.index.version' "$RUNNER_TEMP/restapi-index.json")"
      - name: Publish swagger.json and index
        # manual runs (Actions tab, "Run workflow") publish too, from whatever branch they run on
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SWAGGER_PATH: ${{ secrets.FTP_SWAGGER_PATH }}
          FTP_INDEX_PATH: ${{ secrets.FTP_INDEX_PATH }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "FTP_HOST not set, skipping"
            exit 0
          fi
          # $1: local file, $2: remote path as the FTP account sees it (absolute paths start at the FTP root, not the server's /)
          upload() {
            if [ -z "$2" ]; then
              echo "no remote path for $(basename "$1"), skipping"
              return 0
            fi
            local dir file
            dir=$(dirname "$2")
            file=$(basename "$2")
            # an absolute path needs a leading %2F in the URL, otherwise curl treats it as relative to the login directory
            case "$dir" in
              /*) dir="%2F${dir#/}" ;;
            esac
            # upload under a temp name and rename, so the public file is never half-written;
            # the temp name is per run, so concurrent runs do not rename each other's upload away
            local tmp="$file.$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tmp"
            # --ssl-reqd: never send the credentials unencrypted
            curl -fsS --ssl-reqd --max-time 300 --ftp-create-dirs --user "$FTP_USERNAME:$FTP_PASSWORD" \
              -T "$1" "ftp://$FTP_HOST/$dir/$tmp" \
              -Q "-RNFR $tmp" -Q "-RNTO $file"
            echo "uploaded $(basename "$1") to $2"
          }
          upload "$RUNNER_TEMP/swagger.json" "$FTP_SWAGGER_PATH"
          upload "$RUNNER_TEMP/restapi-index.json" "$FTP_INDEX_PATH"
      - name: Setup ChromeDriver
        timeout-minutes: 20
        run: |
          sudo chmod 755 /home/runner/work/ctsms/ctsms/.github/workflows/setup_selenium.sh
          sudo /home/runner/work/ctsms/ctsms/.github/workflows/setup_selenium.sh
          sudo chmod 755 /home/runner/work/ctsms/ctsms/.github/workflows/run_selenium_test.sh
          # Ubuntu 26.04 dropped wkhtmltopdf. The jammy build bundles Qt, and
          # resolute still provides every library that package depends on.
          if ! sudo apt-get -q -y install wkhtmltopdf; then
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
              -o "$RUNNER_TEMP/wkhtmltox.deb" \
              https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
            echo "4f723b2691ad8638a9df960e0421d346d7315083e3583a334f33362280ddba15  $RUNNER_TEMP/wkhtmltox.deb" | sha256sum -c -
            sudo apt-get -q -y install "$RUNNER_TEMP/wkhtmltox.deb"
          fi
          wkhtmltopdf --version
      # after the last apt install; only when the restore missed (new runner image or package list),
      # dropping .debs of superseded versions first so the cache does not grow from run to run
      - name: Clean apt packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get -q autoclean
          sudo du -sh /var/cache/apt-ci
      - name: Save apt packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /var/cache/apt-ci/*.deb
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
#          xvfb-run java -Dwebdriver.chrome.driver=/usr/bin/chromedriver -jar selenium-server-standalone-4.4.0.jar 2>&1 &
#          sleep 5
      - name: Load demo data
        run: |
          /ctsms/dbtool.sh -ldd -f
      - name: Run tests
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          /home/runner/work/ctsms/ctsms/.github/workflows/run_selenium_test.sh org.phoenixctms.ctsms.selenium.proband.* "Proband Tests" git@phoenixctms.org
          /home/runner/work/ctsms/ctsms/.github/workflows/run_selenium_test.sh org.phoenixctms.ctsms.selenium.trial.* "Trial Tests" git@phoenixctms.org
#      - name: test perl selenium remote
#        run: |
#          perl /home/runner/work/ctsms/ctsms/.github/workflows/seleniumtest.pl