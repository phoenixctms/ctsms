reviews:
  path_filters:
    # MagicDraw UML model and profiles (edited in MagicDraw, code is generated by AndroMDA)
    - "!mda/src/main/uml/**"
    # bundled Maven repository with AndroMDA jars and profiles
    - "!repository/**"
    # build output
    - "!**/target/**"
    # minified assets
    - "!**/*.min.js"
    - "!**/*.min.css"
    # binary files
    - "!**/*.jar"
    - "!**/*.zip"
    - "!**/*.png"
    - "!**/*.gif"
    - "!**/*.jpg"
    - "!**/*.ico"
    - "!**/*.xls"
    - "!**/*.xlsx"
  path_instructions:
    - path: "**/*.java"
      instructions: |
        VO classes (org.phoenixctms.ctsms.vo.*), domain entities, DAO and service base classes and
        service interfaces are generated by AndroMDA from the UML model (mda/src/main/uml) at build
        time and are not in the repository. Do not infer their types from usage. In particular, the
        ids of *OutVO classes are primitive long (compare with ==), while ids of *InVO classes and of
        domain entities are Long (compare with equals).
