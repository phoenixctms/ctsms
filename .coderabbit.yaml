reviews:
  path_filters:
    # MagicDraw UML model and profiles (edited in MagicDraw, code is generated by AndroMDA)
    - "!mda/src/main/uml/**"
    # bundled Maven repository with AndroMDA jars and profiles
    - "!repository/**"
    # build output
    - "!**/target/**"
    # minified assets
    - "!**/*.min.js"
    - "!**/*.min.css"
    # binary files
    - "!**/*.jar"
    - "!**/*.zip"
    - "!**/*.png"
    - "!**/*.gif"
    - "!**/*.jpg"
    - "!**/*.ico"
    - "!**/*.xls"
    - "!**/*.xlsx"
