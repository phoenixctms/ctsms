<?xml version="1.0" encoding="UTF-8" ?>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:pe="http://primefaces.org/ui/extensions">
<h:head>
	<title>input field localization</title>
</h:head>
<h:body>
	<ui:composition>
		<h:form id="inputfieldl10n_form">
			<p:remoteCommand
				process="@this"
				name="changeInputFieldL10n"
				actionListener="#{inputFieldL10nBean.change(inputFieldBean.in.id)}"
				oncomplete="handleUpdateInputFieldTabTitles(xhr, status, args)"
				update=":tabView:inputfieldl10n_form:l10n_input" />
			<h:panelGrid columns="1" id="l10n_input" cellpadding="0"
				styleClass="ctsms-content-panelgrid">
				<p:panel>
					<f:facet name="header">
						<h:outputText value="#{messages.input_field_l10n_tab_label}" />
					</f:facet>
					<h:panelGrid columns="3" cellpadding="2"
						columnClasses="ctsms-label-for-column,ctsms-input-column,ctsms-message-for-column">
						<h:outputLabel for="l10nlocale"
							value="#{inputfieldlabels.input_field_l10n_locale_label}" />
						<h:panelGroup>
							<p:selectOneMenu id="l10nlocale"
								value="#{inputFieldL10nBean.locale}"
								disabled="#{!inputFieldL10nBean.created}"
								styleClass="ctsms-control">
								<f:selectItems value="#{inputFieldL10nBean.locales}" />
								<p:ajax process="@this" listener="#{inputFieldL10nBean.changeLocale}"
									update=":tabView:inputfieldl10n_form:l10n_input" />
							</p:selectOneMenu>
							<p:tooltip rendered="#{enableTooltips}" for="l10nlocale">
								<h:outputText value="#{inputfieldlabels.input_field_l10n_locale_tooltip}"
									escape="false" />
							</p:tooltip>
						</h:panelGroup>
						<p:message for="l10nlocale" />
					</h:panelGrid>
					<c:forEach items="#{inputFieldL10nBean.editors}" var="editor" varStatus="status">
						<p:fieldset id="l10nbundle_#{status.index}" legend="#{inputFieldL10nBean.getBundleLabel(editor.bundle)}"
							styleClass="ctsms-l10n-fieldset">
							<h:panelGrid columns="1" cellpadding="0"
								styleClass="ctsms-l10n-codemirror-panelgrid"
								rowClasses="ctsms-codemirror-input-row,ctsms-codemirror-message-for-row,ctsms-toolbar-row">
								<pe:codeMirror id="l10ntext_#{status.index}"
									mode="properties" theme="eclipse"
									value="#{editor.text}"
									readOnly="#{!inputFieldL10nBean.created}"
									required="false" lineWrapping="true" lineNumbers="true" />
								<h:outputText value="#{editor.modifiedAnnotation}" styleClass="ctsms-l10n-modified" />
								<p:commandButton id="l10nsave_#{status.index}"
									process="@this,l10ntext_#{status.index}"
									value="#{labels.update_button_label}"
									actionListener="#{inputFieldL10nBean.save(editor.bundleName)}"
									oncomplete="handleUpdateInputFieldTabTitles(xhr, status, args)"
									icon="ui-icon ui-icon-disk" ajax="true"
									disabled="#{!inputFieldL10nBean.created}"
									update=":tabView:inputfieldl10n_form:l10nbundle_#{status.index} :tabView:inputfieldl10n_form:l10nmissing :tabView:inputfieldl10n_form:l10nmessages" />
							</h:panelGrid>
						</p:fieldset>
					</c:forEach>
					<p:fieldset id="l10nmissing" legend="#{inputfieldlabels.input_field_l10n_missing_keys_label}">
						<h:outputText rendered="#{inputFieldL10nBean.missingKeysEmpty}"
							value="#{inputfieldlabels.input_field_l10n_no_missing_keys}" />
						<p:dataTable rendered="#{!inputFieldL10nBean.missingKeysEmpty}"
							value="#{inputFieldL10nBean.missingKeys}" var="missingKey"
							styleClass="ctsms-datatable">
							<p:column headerText="#{inputfieldlabels.input_field_l10n_missing_key_bundle_column}">
								<h:outputText value="#{inputFieldL10nBean.getBundleLabel(missingKey.bundle)}" />
							</p:column>
							<p:column headerText="#{inputfieldlabels.input_field_l10n_missing_key_target_column}">
								<h:outputText value="#{missingKey.target.name}" />
							</p:column>
							<p:column headerText="#{inputfieldlabels.input_field_l10n_missing_key_key_column}">
								<h:outputText value="#{missingKey.l10nKey}" />
							</p:column>
							<p:column headerText="#{inputfieldlabels.input_field_l10n_missing_key_usage_column}">
								<h:outputText value="#{missingKey.usage}" />
							</p:column>
						</p:dataTable>
					</p:fieldset>
					<p:messages id="l10nmessages" globalOnly="true" />
					<p:toolbar>
						<p:toolbarGroup align="right">
							<p:commandButton process="@this"
								value="#{labels.load_button_label}"
								actionListener="#{inputFieldL10nBean.changeLocale}"
								oncomplete="handleUpdateInputFieldTabTitles(xhr, status, args)"
								icon="ui-icon ui-icon-refresh" ajax="true"
								disabled="#{!inputFieldL10nBean.created}"
								update=":tabView:inputfieldl10n_form:l10n_input" />
						</p:toolbarGroup>
					</p:toolbar>
				</p:panel>
			</h:panelGrid>
		</h:form>
	</ui:composition>
</h:body>
</html>
