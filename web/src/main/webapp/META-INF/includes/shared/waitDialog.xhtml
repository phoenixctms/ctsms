<?xml version="1.0" encoding="UTF-8" ?>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html">
<h:head>
	<title>wait dialog</title>
</h:head>
<h:body>
	<ui:composition>
		<!-- waitDialogVar names another widget, e.g. for the search pages, which show it themselves only for slow requests:
			the ajax override shows waitDialog for every request -->
		<p:dialog widgetVar="#{empty waitDialogVar ? 'waitDialog' : waitDialogVar}" modal="true" closable="false"
			onShow="dequeueShowDialog();"
			onHide="#{empty waitDialogVar ? 'waitDialog' : waitDialogVar}.disableModality();dequeueShowDialog();"
			showEffect="" hideEffect="">
			<span class="ctsms-field-icon ctsms-icon-loading"></span>
			<h:outputLabel value="#{labels.wait_message}" />

		</p:dialog>
	</ui:composition>
</h:body>
</html>
