<?xml version="1.0" encoding="UTF-8" ?>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html">
<h:head>
	<title>duty roster google calendar url</title>
</h:head>
<h:body>
	<ui:composition>
		<h:panelGroup id="google_calendar_url"
			rendered="#{!googleCalendarUrlFormRow and !googleCalendarUrlFilterRow and googleCalendarUrlBean.showGoogleCalendarUrl}">
			<h:outputText value="#{googleCalendarUrlLabel} " />
			<h:outputLink value="#{googleCalendarUrlBean.googleCalendarIcsUrl}"
				target="_blank" title="#{googleCalendarUrlTooltip}">
				<h:outputText
					value="#{applicationScopeBean.clipStringMid(googleCalendarUrlBean.googleCalendarIcsUrl)}" />
			</h:outputLink>
		</h:panelGroup>
		<h:outputLabel
			rendered="#{googleCalendarUrlFormRow and googleCalendarUrlBean.showGoogleCalendarUrl}" />
		<h:outputLabel
			rendered="#{(googleCalendarUrlFormRow or googleCalendarUrlFilterRow) and googleCalendarUrlBean.showGoogleCalendarUrl}"
			value="#{googleCalendarUrlLabel}" />
		<h:panelGroup
			rendered="#{(googleCalendarUrlFormRow or googleCalendarUrlFilterRow) and googleCalendarUrlBean.showGoogleCalendarUrl}">
			<h:outputLink value="#{googleCalendarUrlBean.googleCalendarIcsUrl}"
				target="_blank" title="#{googleCalendarUrlTooltip}">
				<h:outputText styleClass="ctsms-plaintext-top"
					value="#{applicationScopeBean.clipStringMid(googleCalendarUrlBean.googleCalendarIcsUrl)}" />
			</h:outputLink>
		</h:panelGroup>
		<h:outputLabel
			rendered="#{(googleCalendarUrlFormRow or googleCalendarUrlFilterRow) and googleCalendarUrlBean.showGoogleCalendarUrl}" />
	</ui:composition>
</h:body>
</html>
