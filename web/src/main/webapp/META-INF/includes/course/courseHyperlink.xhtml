<?xml version="1.0" encoding="UTF-8" ?>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html">
<h:head>
	<title>course hyperlinks</title>
</h:head>
<h:body>
	<ui:composition>
		<h:form id="coursehyperlink_form">
			<p:remoteCommand process="@this" name="changeCourseHyperlink"
				actionListener="#{hyperlinkBean.changeCourse(courseBean.in.id)}"
				oncomplete="handleUpdateCourseTabTitles(xhr, status, args)"
				update=":tabView:coursehyperlink_form:hyperlink_list,:tabView:coursehyperlink_form:hyperlink_input" />

			<ui:include src="/META-INF/includes/shared/hyperlink.xhtml">
				<ui:param name="namingContainer"
					value=":tabView:coursehyperlink_form" />
				<ui:param name="jsUpdateTabTitles"
					value="handleUpdateCourseTabTitles" />
			</ui:include>
		</h:form>
	</ui:composition>
</h:body>
</html>
